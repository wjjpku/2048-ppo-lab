name: CPU checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: cpu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU dependencies and project
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[test]'
      - name: Core and publication tests
        run: python -m pytest -q
      - name: Verify every archived replay step
        run: python scripts/verify_archive.py
      - name: Frozen CPU inference smoke (no training)
        run: python -m game2048 demo --episodes 1 --output demo-output/ci-smoke
      - name: JavaScript syntax
        run: node --check web/archive-base3/app.js
